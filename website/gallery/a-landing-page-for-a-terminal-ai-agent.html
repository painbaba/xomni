<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>a landing page for a terminal AI agent — XOMNI Omni Design</title>
<style>
:root{--bg:#050607;--surface-1:#0A0C0E;--surface-2:#101316;--elevated:#171B1F;--ink:#E8EAED;--muted:#A6ADB5;--faint:#7B828A;--border:#1E2329;--accent:#00E5A0;--accent-hover:#00FFB0;--accent-dim:#00B87E;--success:#2FD6A1;--danger:#FF6B6B;--warning:#FFB454;--syntax:#5CC8FF;--font-sans:ui-sans-serif, 'Segoe UI', system-ui, -apple-system, sans-serif;--font-mono:ui-monospace, 'Cascadia Code', Consolas, monospace;--space-1:4px;--space-2:8px;--space-3:16px;--space-4:24px;--space-5:32px;--space-6:48px;--space-7:64px;--radius-1:6px;--radius-2:10px;--radius-3:16px;--shadow-1:0 1px 2px rgba(0,0,0,.4);--shadow-2:0 4px 12px rgba(0,0,0,.4);--shadow-3:0 12px 32px rgba(0,0,0,.5);--ease-out-expo:cubic-bezier(.16,1,.3,1);--dur-fast:150ms;--dur-med:300ms;--dur-slow:500ms;color-scheme:dark;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);line-height:1.6;min-height:100dvh}
.mono,code{font-family:var(--font-mono)}
.hero{padding:clamp(48px,10vw,120px) 24px 40px;max-width:1080px;margin:0 auto;display:grid;grid-template-columns:1.4fr 1fr;gap:48px;align-items:end}
.hero h1{font-size:clamp(36px,6vw,64px);line-height:1.05;letter-spacing:-0.02em;font-weight:700;max-width:14ch}
.sub{color:var(--muted);font-size:clamp(16px,2vw,20px);margin-top:16px;max-width:52ch}
.cta-row{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}
button{font-family:var(--font-sans);font-size:15px;padding:12px 20px;border-radius:var(--radius-2);cursor:pointer;min-height:44px;transition:transform var(--dur-fast) var(--ease-out-expo),box-shadow var(--dur-fast)}
.primary{background:var(--accent);color:#000;border:1px solid var(--accent);font-weight:600}
.primary:hover{background:var(--accent-hover);box-shadow:0 0 24px var(--accent-dim)}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--border)}
.ghost:hover{border-color:var(--accent);color:var(--accent)}
.band{max-width:1080px;margin:0 auto;padding:40px 24px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.stat{padding:24px 0}
.stat strong{font-family:var(--font-mono);font-size:clamp(28px,4vw,44px);color:var(--accent);font-variant-numeric:tabular-nums}
.stat span{display:block;color:var(--muted);font-size:14px;text-transform:uppercase;letter-spacing:.08em}
.card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius-2);padding:24px;transition:border-color var(--dur-fast)}
.card:hover{border-color:var(--accent)}
.card h3{font-size:18px;margin-bottom:8px}
.card p{color:var(--muted);font-size:15px}
.cta{text-align:left;padding-top:64px}
.cta h2{font-size:clamp(28px,4vw,44px)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:12px;border-bottom:1px solid var(--border)}
th{color:var(--muted);font-weight:600}
@media(max-width:720px){.hero{grid-template-columns:1fr}.stats{grid-template-columns:1fr}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<section class="hero"><h1>a landing page for a terminal AI agent</h1><p class="sub">A clear line about what this is and why it matters.</p><div class="cta-row"><button class="primary">Get started</button><button class="ghost">Learn more</button></div></section><section class="band stats"><div class="stat"><strong>1</strong><span>metric</span></div><div class="stat"><strong>2</strong><span>metric</span></div><div class="stat"><strong>3</strong><span>metric</span></div></section><section class="band"><div class="card-grid"><article class="card"><h3>Feature one</h3><p>What it does, briefly.</p></article><article class="card"><h3>Feature two</h3><p>What it does, briefly.</p></article><article class="card"><h3>Feature three</h3><p>What it does, briefly.</p></article></div></section><section class="band cta"><h2>Ready?</h2><button class="primary">Start now</button></section>
<script>
(function(){if(!matchMedia('(prefers-reduced-motion: reduce)').matches){document.querySelectorAll('.card').forEach(function(c,i){c.style.opacity='0';c.style.transform='translateY(12px)';c.style.transition='opacity 400ms cubic-bezier(.16,1,.3,1),transform 400ms cubic-bezier(.16,1,.3,1)';setTimeout(function(){c.style.opacity='1';c.style.transform='none'},80*i)})}})();
</script>
</body>
</html>
