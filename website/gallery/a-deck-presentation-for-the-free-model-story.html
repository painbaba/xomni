<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>a deck presentation for the free-model story — XOMNI Deck</title>
<style>
:root{--bg:#050A14;--surface-1:#0A1120;--surface-2:#101A2E;--elevated:#16223A;--ink:#E4F2FF;--muted:#8FA8C4;--faint:#5E7590;--border:#1C2A42;--accent:#5CC8FF;--accent-hover:#8FDBFF;--accent-dim:#3AA8E8;--success:#5CC8FF;--danger:#FF6B6B;--warning:#FFB454;--syntax:#00E5A0;--font-sans:ui-sans-serif, 'Segoe UI', system-ui, -apple-system, sans-serif;--font-mono:ui-monospace, 'Cascadia Code', Consolas, monospace;--space-1:4px;--space-2:8px;--space-3:16px;--space-4:24px;--space-5:32px;--space-6:48px;--space-7:64px;--radius-1:6px;--radius-2:10px;--radius-3:16px;--shadow-1:0 1px 2px rgba(0,0,0,.4);--shadow-2:0 4px 12px rgba(0,0,0,.4);--shadow-3:0 12px 32px rgba(0,0,0,.5);--ease-out-expo:cubic-bezier(.16,1,.3,1);--dur-fast:150ms;--dur-med:300ms;--dur-slow:500ms;color-scheme:dark;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);display:grid;place-items:center;padding:24px}
.mono,code{font-family:var(--font-mono)}
.deck{width:min(1280px,100%);aspect-ratio:16/9;background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius-2);display:flex;flex-direction:column;justify-content:center;padding:clamp(32px,6vw,96px);position:relative;overflow:hidden}
.deck::before{content:"";position:absolute;inset:auto 0 0 0;height:4px;background:var(--accent)}
h1{font-size:clamp(40px,7vw,96px);line-height:1.02;letter-spacing:-0.03em;font-weight:700;max-width:14ch}
.sub{color:var(--muted);font-size:clamp(18px,2.6vw,34px);margin-top:20px;max-width:40ch}
.slide-note{position:absolute;top:24px;right:28px;font-family:var(--font-mono);font-size:14px;color:var(--faint)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="deck" role="main">
  <div class="slide-note">01 / Decide/Learn</div>
  <section class="hero"><h1>a deck presentation for the free-model story</h1><p class="sub">A clear line about what this is and why it matters.</p><div class="cta-row"><button class="primary">Get started</button><button class="ghost">Learn more</button></div></section><section class="band stats"><div class="stat"><strong>1</strong><span>metric</span></div><div class="stat"><strong>2</strong><span>metric</span></div><div class="stat"><strong>3</strong><span>metric</span></div></section><section class="band"><div class="card-grid"><article class="card"><h3>Feature one</h3><p>What it does, briefly.</p></article><article class="card"><h3>Feature two</h3><p>What it does, briefly.</p></article><article class="card"><h3>Feature three</h3><p>What it does, briefly.</p></article></div></section><section class="band cta"><h2>Ready?</h2><button class="primary">Start now</button></section>
</main>
<script>
(function(){if(!matchMedia('(prefers-reduced-motion: reduce)').matches){var d=document.querySelector('.deck');d.style.opacity='0';d.style.transform='translateY(16px)';d.style.transition='opacity 500ms cubic-bezier(.16,1,.3,1),transform 500ms cubic-bezier(.16,1,.3,1)';requestAnimationFrame(function(){requestAnimationFrame(function(){d.style.opacity='1';d.style.transform='none'})})}})();
</script>
</body>
</html>
