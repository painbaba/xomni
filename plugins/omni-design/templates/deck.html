<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{TITLE} — XOMNI Deck</title>
<style>
{TOKENS}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);display:grid;place-items:center;padding:24px}
.mono,code{font-family:var(--font-mono)}
.deck{width:min(1280px,100%);aspect-ratio:16/9;background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius-2);display:flex;flex-direction:column;justify-content:center;padding:clamp(32px,6vw,96px);position:relative;overflow:hidden}
.deck::before{content:"";position:absolute;inset:auto 0 0 0;height:4px;background:var(--accent)}
h1{font-size:clamp(40px,7vw,96px);line-height:1.02;letter-spacing:-0.03em;font-weight:700;max-width:14ch}
.sub{color:var(--muted);font-size:clamp(18px,2.6vw,34px);margin-top:20px;max-width:40ch}
.slide-note{position:absolute;top:24px;right:28px;font-family:var(--font-mono);font-size:14px;color:var(--faint)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="deck" role="main">
  <div class="slide-note">01 / {SURFACE}</div>
  {BODY}
</main>
<script>
(function(){if(!matchMedia('(prefers-reduced-motion: reduce)').matches){var d=document.querySelector('.deck');d.style.opacity='0';d.style.transform='translateY(16px)';d.style.transition='opacity 500ms cubic-bezier(.16,1,.3,1),transform 500ms cubic-bezier(.16,1,.3,1)';requestAnimationFrame(function(){requestAnimationFrame(function(){d.style.opacity='1';d.style.transform='none'})})}})();
</script>
</body>
</html>
