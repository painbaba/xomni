name: audit-log
version: "1.0.0"
description: "Enterprise tamper-evident audit trail (~/.xomni-audit/audit.jsonl, XOMNI_AUDIT_FILE override): append-only JSONL where each record's sha256 covers the previous record's hash, so /audit verify detects any edit or deletion of past records. Commands: /audit, /audit show <id>, /audit verify. Zero hooks, zero per-turn cost."
