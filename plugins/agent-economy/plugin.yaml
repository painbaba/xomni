name: agent-economy
version: "1.0.0"
description: "Agent-to-agent economy (pure stdlib, zero hooks): TTL-bound service offers (offers.json) + a trade lifecycle state machine CREATED -> ACCEPTED -> FULFILLED -> SETTLED (trades.json) with sha256 result digests, double-claim prevention, and a verifiable receipt for every trade (receipt_id = sha256 of the receipt payload fields). Every illegal transition fails loud with TradeError. Commands: /economy ledger. Zero per-turn cost."
