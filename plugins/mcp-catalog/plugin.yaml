name: mcp-catalog
version: "1.3.0"
description: "MCP catalog layer (Goose P3a port): discover, validate, and install MCP servers as agent tools. Catalog store: ~/.hermes-mcp/catalogs/ (override HERMES_MCP_CATALOG_DIR); marketplace: data/mcp/catalog.json (311 servers) with stars/keyless/security badges in /mcp list and /mcp search <query> (keyword search over name/description/purpose). Commands: /mcp list | search <query> | tools [server] | add <path> | add <name> [--yes] | status | validate <path>. /mcp add <name> [--yes] resolves the catalog entry and appends an idempotent mcp_servers block to host config.yaml (loud failures); /mcp status prints the marketplace-vs-host gap line (311 in catalog vs mcp_servers registered/enabled). Model tool: mcp_call(server, tool, args) — dispatches through the host registry (mcp__<server>__<tool>) when the server is registered in config.yaml mcp_servers."
