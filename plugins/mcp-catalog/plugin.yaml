name: mcp-catalog
version: "1.4.0"
description: "MCP catalog layer (Goose P3a port): discover, validate, and install MCP servers as agent tools. Catalog store: ~/.hermes-mcp/catalogs/ (override HERMES_MCP_CATALOG_DIR); marketplace: data/mcp/catalog.json (311 servers) with stars/keyless/security badges in /mcp list and /mcp search <query> (keyword search over name/description/purpose). Commands: /mcp list | search <query> | tools [server] | add <path> | add <name> [--yes] | add <name> <url-or-command> [--yes] | catalog-add <name> <install-command> | status | validate <path>. /mcp add <name> [--yes] resolves the catalog entry and appends an idempotent mcp_servers block to host config.yaml (loud failures); /mcp add <name> <url-or-command> [--yes] self-catalogs a brand-new server into host config AND catalog json; /mcp catalog-add <name> <install-command> is catalog-only. Self-cataloging (U-SURF-1): any installed/imported server auto-indexes into the catalog json as a source='user-added' entry (badges, security=REVIEW, added_at), idempotently, preserving the rest of the catalog byte-for-byte. /mcp status prints the marketplace-vs-host gap line (311 in catalog vs mcp_servers registered/enabled). Model tool: mcp_call(server, tool, args) — dispatches through the host registry (mcp__<server>__<tool>) when the server is registered in config.yaml mcp_servers."
