name: mcp-catalog
version: "1.2.0"
description: "MCP catalog layer (Goose P3a port): discover, validate, and install MCP servers as agent tools. Catalog store: ~/.hermes-mcp/catalogs/ (override HERMES_MCP_CATALOG_DIR); marketplace: data/mcp/catalog.json (311 servers) with stars/keyless/security badges in /mcp list. Commands: /mcp list | tools [server] | add <path> | add <name> [--yes] | status | validate <path>. /mcp add <name> [--yes] resolves the catalog entry and appends an idempotent mcp_servers block to host config.yaml (loud failures). Model tool: mcp_call(server, tool, args) — dispatches through the host registry (mcp__<server>__<tool>) when the server is registered in config.yaml mcp_servers."
