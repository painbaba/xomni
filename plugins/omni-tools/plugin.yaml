name: omni-tools
version: "1.0.0"
description: "Capability corpus + BM25 router (TOOL-SEARCH.md): indexes all 17 plugin surfaces (tools + slash commands), 311 MCP servers (data/mcp/catalog.json), and 180 curated skills (data/curated-skills.json) into one pure-stdlib searchable index. Model tool: xomni_capabilities(query, kind, limit) — ranked matches with source + status + load hints. Commands: /tools-search <q> [--kind=...] [--limit=N], /tools-index (rebuild + stats), /tools-stats (corpus size + top-5 recall + last eval time). Zero hooks; corpus cached in SQLite keyed on source mtimes."
