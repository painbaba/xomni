name: skill-drafter
version: "1.0.0"
description: "Auto-skill from successful sessions: draft_skill from transcripts, /skill draft + /skill save + /skill draft-session, 5+ tool-call gate, validation before save (fail-loud on REJECT). U-SURF-2: lifecycle() one-call pipeline (draft->validate->save->receipt->publish offer) + /skill from-session <id> + /skill sync (cross-profile, diff-based no-clobber). Zero hooks, zero per-turn cost."
