<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>⚔ WAR ROOM — GHOST vs DEFENDERS</title>
<style>
  :root { --bg:#0a0e14; --panel:#111827; --line:#1f2937; --ink:#e5e7eb; --dim:#6b7280;
          --ghost:#ef4444; --def:#3b82f6; --think:#a78bfa; --action:#fbbf24; --result:#34d399; --final:#f472b6; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--ink); font-family:'Cascadia Code','Fira Code',Consolas,monospace; font-size:12.5px; }
  header { display:flex; align-items:center; gap:14px; padding:10px 16px; border-bottom:1px solid var(--line); background:#0d1420; position:sticky; top:0; z-index:10; }
  header h1 { font-size:15px; letter-spacing:1px; }
  .live { color:var(--result); animation:blink 1.2s infinite; }
  @keyframes blink { 50% { opacity:.3; } }
  .stats { margin-left:auto; display:flex; gap:18px; color:var(--dim); font-size:11px; }
  .stats b { color:var(--ink); }
  main { display:grid; grid-template-columns:1fr 1fr; gap:0; height:calc(100vh - 110px); }
  .col { overflow-y:auto; padding:10px 12px; }
  .col.g { border-right:1px solid var(--line); }
  .colhead { display:flex; align-items:center; gap:8px; font-weight:700; font-size:12px; text-transform:uppercase; letter-spacing:1.5px; padding-bottom:8px; border-bottom:1px solid var(--line); margin-bottom:8px; position:sticky; top:0; background:var(--bg); }
  .dot { width:9px; height:9px; border-radius:50%; display:inline-block; }
  .ev { padding:3px 0; border-bottom:1px dashed #161e2b; line-height:1.45; }
  .ev .ts { color:var(--dim); margin-right:6px; }
  .ev.think { color:var(--think); font-style:italic; }
  .ev.action { color:var(--action); }
  .ev.result { color:var(--result); }
  .ev.final { color:var(--final); font-weight:700; }
  .ev.raw { color:var(--dim); }
  .ev .k { font-size:10px; color:var(--dim); border:1px solid var(--line); border-radius:3px; padding:0 4px; margin-right:5px; }
  footer { display:grid; grid-template-columns:1fr 1fr; border-top:1px solid var(--line); height:110px; }
  .panel { padding:8px 14px; overflow-y:auto; }
  .panel h3 { font-size:10px; color:var(--dim); text-transform:uppercase; letter-spacing:1px; margin-bottom:5px; }
  .panel pre { white-space:pre-wrap; font-size:11px; color:var(--ink); font-family:inherit; }
  #intel { border-right:1px solid var(--line); }
  .empty { color:var(--dim); text-align:center; padding:40px 10px; font-style:italic; }
  .jump { position:sticky; bottom:8px; left:50%; transform:translateX(-50%); background:var(--def); color:#fff; border:none; border-radius:999px; padding:6px 14px; font-size:11px; font-weight:700; cursor:pointer; box-shadow:0 2px 10px rgba(0,0,0,.4); }
  .jump:hover { filter:brightness(1.2); }
</style>
</head>
<body>
<header>
  <h1>⚔ WAR ROOM <span class="live">● LIVE</span></h1>
  <div class="stats">
    <span>ghost: <b id="s_ghost">—</b></span>
    <span>defenders: <b id="s_def">—</b></span>
    <span>events: <b id="s_ev">0</b></span>
    <span id="s_time">—</span>
  </div>
</header>
<main id="cols"></main>
<footer>
  <div class="panel" id="intel"><h3>🧠 Intel channel (intel.md — shared battlefield)</h3><pre id="intel_txt">waiting…</pre></div>
  <div class="panel" id="bank"><h3>🏦 Bank log (defense events)</h3><pre id="bank_txt">waiting…</pre></div>
</footer>
<script>
const esc = s => (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function render(data) {
  const cols = data.columns || [];
  const main = document.getElementById('cols');
  // preserve each column's scroll position across re-render
  const saved = {};
  for (const colEl of main.children) {
    if (colEl.id && colEl.id.startsWith('col_')) saved[colEl.id] = colEl.scrollTop;
  }
  let html = '';
  let ghostN = 0, defN = 0;
  for (const c of cols) {
    const isGhost = (c.side === 'ghost');
    if (isGhost) ghostN = (c.events||[]).length; else defN += (c.events||[]).length;
    const cid = 'col_' + (isGhost ? 'g' : 'd');
    html += `<div class="col ${isGhost?'g':''}" id="${cid}">
      <div class="colhead"><span class="dot" style="background:${c.color}"></span> ${esc(c.label)} <span style="margin-left:auto;color:var(--dim);font-size:10px">${(c.events||[]).length} events</span></div>`;
    if (!c.events || !c.events.length) html += `<div class="empty">waiting for first thoughts…</div>`;
    for (const e of (c.events||[]).slice(-120)) {
      html += `<div class="ev ${e.cls}"><span class="ts">${e.ts}</span><span class="k">${e.kind}</span>${esc(e.text)}</div>`;
    }
    html += '</div>';
  }
  main.innerHTML = html || '<div class="empty" style="grid-column:1/3">no columns — start a battle</div>';
  document.getElementById('s_ghost').textContent = ghostN ? ghostN + ' ev' : '—';
  document.getElementById('s_def').textContent = defN ? defN + ' ev' : '—';
  document.getElementById('s_ev').textContent = ghostN + defN;
  document.getElementById('intel_txt').textContent = data.intel || '(empty)';
  document.getElementById('bank_txt').textContent = data.bank || '(empty)';
  document.getElementById('s_time').textContent = new Date().toLocaleTimeString();
  // scroll policy: restore saved position if the user scrolled up;
  // otherwise autoscroll to bottom. (User explicitly wants NO snap-back.)
  for (const colEl of main.children) {
    if (!colEl.id || !saved.hasOwnProperty(colEl.id)) continue;
    if (userScrolledUp(colEl)) {
      colEl.scrollTop = saved[colEl.id];
    } else {
      colEl.scrollTop = colEl.scrollHeight;
    }
  }
}

// true when the user has scrolled up away from the bottom of a column
function userScrolledUp(colEl) {
  return colEl.scrollHeight - colEl.scrollTop - colEl.clientHeight > 60;
}

// track scroll intent per column; add a jump-to-live button when scrolled up
document.addEventListener('scroll', function(e) {
  const col = e.target;
  if (col && col.classList && col.classList.contains('col')) {
    const up = userScrolledUp(col);
    let btn = col.querySelector('.jump');
    if (up && !btn) {
      btn = document.createElement('button');
      btn.className = 'jump';
      btn.textContent = '⬇ live';
      btn.onclick = () => { col.scrollTop = col.scrollHeight; btn.remove(); };
      col.appendChild(btn);
    } else if (!up && btn) {
      btn.remove();
    }
  }
}, true);

async function tick() {
  try {
    const r = await fetch('/api/state');
    render(await r.json());
  } catch(e) { /* server restarting */ }
}
tick();
setInterval(tick, 2000);
</script>
</body>
</html>
